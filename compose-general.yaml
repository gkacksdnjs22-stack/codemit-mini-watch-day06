name: m5d1-general
services:
  general-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: general_user
      POSTGRES_PASSWORD: classroom-general-db
    volumes:
      - general-data:/var/lib/postgresql/data
      - ./general/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U general_user -d general_db']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [general-db-net]
  general-api:
    build: ./general
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: general_user
      DB_PASSWORD: classroom-general-db
      SECRET_KEY: classroom-day07-general-separate-local-practice-key
      SESSION_COOKIE_SECURE: 'false'
      DB_SSLMODE: prefer
      EVENT_TOKEN: classroom-day07-events-local-only-token
      MONITOR_URL: http://monitor-api:5000/api/events
      MONITOR_API_URL: http://monitor-api:5000
      DASHBOARD_URL: http://localhost:8082/
      PORT: '5000'
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [general-web-net, general-db-net, events]
  general-gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8081:80']
    volumes: ['./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      general-api:
        condition: service_healthy
    networks: [general-web-net]
networks:
  general-web-net: {}
  general-db-net:
    internal: true
  events:
    external: true
    name: m5d1-events
volumes:
  general-data: {}
