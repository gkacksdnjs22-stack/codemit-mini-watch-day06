name: m5d1-monitor
services:
  monitor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor_db
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: classroom-monitor-db
    volumes:
      - monitor-data:/var/lib/postgresql/data
      - ./monitor/backend/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U monitor_user -d monitor_db']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [monitor-db-net]
  monitor-api:
    build: ./monitor/backend
    environment:
      DB_HOST: monitor-db
      DB_PORT: '5432'
      DB_NAME: monitor_db
      DB_USER: monitor_user
      DB_PASSWORD: classroom-monitor-db
      SECRET_KEY: classroom-day07-monitor-separate-local-practice-key
      SESSION_COOKIE_SECURE: 'false'
      DB_SSLMODE: prefer
      EVENT_TOKEN: classroom-day07-events-local-only-token
      PORT: '5000'
      GENERAL_SERVICE_URL: http://general-api:5000
      TRAINING_USERNAME: ${TRAINING_USERNAME:-student}
      TRAINING_PASSWORD: ${TRAINING_PASSWORD:-}
    volumes:
      - ./monitor/backend/learning:/app/learning:ro
    depends_on:
      monitor-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/auth/me', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [monitor-web-net, monitor-db-net, events]
  monitor-web:
    build: ./monitor/next-frontend
    environment:
      MONITOR_API_URL: http://monitor-api:5000
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [monitor-web-net]
  monitor-gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8082:80']
    volumes: ['./gateways/monitor.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      monitor-api:
        condition: service_healthy
      monitor-web:
        condition: service_healthy
    networks: [monitor-web-net]
networks:
  monitor-web-net: {}
  monitor-db-net:
    internal: true
  events:
    external: true
    name: m5d1-events
volumes:
  monitor-data: {}
