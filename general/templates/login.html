<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · 모아</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div id="portal-login" data-csrf="{{ csrf_token() }}" data-registered="{{ 'true' if registered else 'false' }}"><main class="auth-card">
    <a class="site-brand" href="{{ url_for('auth.home') }}">✿ 모아</a>
    <span class="badge auth-badge">다정한 이야기가 모이는 곳</span>
    <h1>모아에 로그인</h1><p class="intro">로그인하면 나의 공간으로 바로 안내할게요.</p>
    {% if registered %}<p class="form-success" role="status">회원가입이 완료됐어요. 새 계정으로 로그인해 주세요.</p>{% endif %}
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">아이디</label><input id="username" name="username" value="{{ values.username }}" autocomplete="username" maxlength="64" required>
        <label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button class="auth-submit" type="submit">로그인</button>
    </form>
    <p class="auth-footer">처음 오셨나요? <a href="{{ url_for('auth.signup') }}">회원가입</a></p>
</main></div>
{% if login_script %}<script type="module" src="{{ url_for('static', filename='portal/' + login_script) }}"></script>{% endif %}
</body></html>
