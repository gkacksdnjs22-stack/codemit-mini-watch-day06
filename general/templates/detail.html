<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }} · 나의 게시판</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        {% include '_site_nav.html' %}
        <p class="post-meta">게시글 번호: {{ post.id }}</p>
        <h1>{{ post.title }}</h1>
        <div class="post-body">{{ post.body }}</div>
        <div class="action-row">
            <a class="button-link" href="{{ url_for('posts.edit_post', post_id=post.id) }}">글 수정</a>
            <a class="action-link" href="{{ url_for('posts.index') }}">목록으로</a>
            <a class="action-link danger" href="{{ url_for('posts.confirm_delete', post_id=post.id) }}">글 삭제</a>
        </div>
    </main>
</body>
</html>
