<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 · 모아</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="auth-card">
    <a class="site-brand" href="{{ url_for('auth.home') }}">✿ 모아</a>
    <span class="badge auth-badge">새로운 이야기를 기다려요</span>
    <h1>게시판 회원가입</h1><p class="intro">나만의 계정을 만들고 함께 이야기를 나눠요.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.signup') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">이름</label><input id="name" name="name" value="{{ values.name }}" autocomplete="name" minlength="2" maxlength="50" required>
        <label for="username">아이디</label><input id="username" name="username" value="{{ values.username }}" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required><p class="field-help">영문·숫자·밑줄 3~32자</p>
        <label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><p class="field-help">10~128자</p>
        <label for="confirmation">비밀번호 확인</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <button class="auth-submit" type="submit">회원가입</button>
    </form>
    <p class="auth-footer">이미 계정이 있나요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
</main></body></html>
