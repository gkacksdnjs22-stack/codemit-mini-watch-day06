<nav class="site-nav" aria-label="서비스 메뉴">
    <a class="site-brand" href="{{ url_for('auth.home') }}">✿ 모아</a>
    <div class="site-links">
        {% if login_user %}
            <span class="nav-user">{{ login_user.name }}님</span>
            {% if login_user.role == 'operator' %}<a href="{{ dashboard_url }}">관리자 화면</a>{% endif %}
            <form class="nav-logout" method="post" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">로그아웃</button>
            </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}">로그인</a>
            <a class="nav-signup" href="{{ url_for('auth.signup') }}">회원가입</a>
        {% endif %}
    </div>
</nav>
